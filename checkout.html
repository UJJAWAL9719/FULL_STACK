<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Krrish Tech Store</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="navbar">

<div class="logo">
KRRISH<span>TECH</span>
</div>

<nav>
<a href="index.html">Home</a>

<a href="products.html">Products</a>

<a href="cart.html">
Cart <b id="cart-count">0</b>
</a>

<a href="checkout.html" class="active">
Checkout
</a>
</nav>

</header>

<main class="checkout-page">

<h1>💳 Checkout</h1>

<form id="checkout-form" class="checkout-form">

<div class="form-group">

<label for="name">
Full Name
</label>

<input
type="text"
id="name"
placeholder="Enter your full name">

<span id="name-error" class="error"></span>

</div>

<div class="form-group">

<label for="address">
Delivery Address
</label>

<textarea
id="address"
placeholder="Enter your complete delivery address"></textarea>

<span id="address-error" class="error"></span>

</div>

<div class="form-group">

<label for="pincode">
Pincode
</label>

<input
type="text"
id="pincode"
placeholder="Enter 6 digit pincode"
maxlength="6">

<span id="pincode-error" class="error"></span>

</div>

<div class="form-group">

<label for="phone">
Phone Number
</label>

<input
type="text"
id="phone"
placeholder="Enter 10 digit phone number"
maxlength="10">

<span id="phone-error" class="error"></span>

</div>

<button type="submit" class="place-order">
Place Order 🚀
</button>

<div id="order-success"></div>

</form>

</main>

<footer>

<div class="footer-logo">
KRRISH<span>TECH</span>
</div>

<p>
Your destination for next-generation technology.
</p>

<p class="copyright">
© 2026 Krrish Tech Store. All Rights Reserved.
</p>

</footer>

<script src="script.js"></script>

</body>
</html>
