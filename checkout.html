<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechStore - Checkout</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        TechStore
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
    </nav>

</header>


<main class="container">

    <h1>Checkout</h1>

    <form class="checkout-form">

        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >


        <label for="address">
            Address
        </label>

        <input
            type="text"
            id="address"
            name="address"
            placeholder="Enter your address"
            required
        >


        <label for="city">
            City
        </label>

        <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter your city"
            required
        >


        <label for="pincode">
            Pincode
        </label>

        <input
            type="text"
            id="pincode"
            name="pincode"
            placeholder="Enter your pincode"
            required
        >


        <label for="phone">
            Phone
        </label>

        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Enter your phone number"
            required
        >


        <fieldset>

            <legend>
                Payment Method
            </legend>

            <label>
                <input
                    type="radio"
                    name="payment"
                    value="cod"
                    required
                >

                Cash on Delivery
            </label>


            <label>
                <input
                    type="radio"
                    name="payment"
                    value="card"
                >

                Credit / Debit Card
            </label>


            <label>
                <input
                    type="radio"
                    name="payment"
                    value="upi"
                >

                UPI
            </label>

        </fieldset>


        <button type="submit" class="btn">
            Place Order
        </button>

    </form>

</main>


<footer>

    <p>
        Contact: support@techstore.com
    </p>

    <p>
        Phone: +91 98765 43210
    </p>

    <p>
        © 2026 TechStore. All Rights Reserved.
    </p>

</footer>

</body>

</html>
